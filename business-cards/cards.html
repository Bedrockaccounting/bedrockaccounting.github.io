<style>
/* Single-sided. 85 x 55 mm trim + 3 mm bleed each side = 91 x 61 mm. Text stays 4 mm inside trim (7 mm from page edge). */
@page { size: 91mm 61mm; margin: 0; }
:root{--ink:#0e1d45;--ink-soft:#4a5878;--accent:#1f4fd1;--navy:#0b2a7a;--sky:#6f9bf2;
--serif:"Source Serif 4",Georgia,serif;--sans:"Public Sans",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font-family:var(--sans);color:var(--ink)}
.card{width:91mm;height:61mm;position:relative;overflow:hidden;background:#fff;padding:7mm 7mm 0 7mm}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:4mm}
.brand{display:flex;align-items:center;gap:2.2mm}
.brand .mark{width:8.5mm;height:8.5mm;flex:none}
.brand .name{font-family:var(--serif);font-weight:600;font-size:13pt;line-height:1}
.brand .sub{font-size:5pt;font-weight:600;letter-spacing:.18em;color:var(--ink-soft);margin-top:1mm}

.qr{width:15mm;text-align:center;flex:none}
.qr .code{width:15mm;height:15mm;display:block}
.qr span{display:block;font-size:4.8pt;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);margin-top:.9mm;white-space:nowrap;margin-left:-2mm;margin-right:-2mm}

.person{margin-top:1mm}
.person h1{font-family:var(--serif);font-weight:600;font-size:10.5pt;line-height:1.1;margin:0}
.person .role{font-size:6.4pt;color:var(--ink-soft);margin-top:.5mm}

ul{list-style:none;margin:2.2mm 0 0;padding:0;display:grid;gap:1.1mm}
li{display:flex;align-items:center;gap:1.8mm;font-size:6.8pt;font-weight:500}
li a{color:var(--ink);text-decoration:none}
li svg{width:2.6mm;height:2.6mm;flex:none}

/* 12 mm tall: 3 mm is bleed, 9 mm visible after cutting; text centred in the visible part. */
.strip{position:absolute;left:0;right:0;bottom:0;height:12mm;background:var(--navy);color:#c4d3f6;
  font-size:5pt;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:0 7mm 3mm;display:flex;align-items:center}
</style></head><body>
